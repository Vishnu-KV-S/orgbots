  catchup: skip
  cron: 0 11 * * *
  timezone: Asia/Kolkata
  mode: work
  input:
    subject: AI in learning products - launches, models and tutoring
    title: 'Late-morning brief: AI in learning'
    objective: >-
      Report what shipped in AI-powered learning in the last day or two: tutoring and
      companion products, AI grading and assessment, curriculum generation, and the
      model releases aimed at education. Name the vendor and the product, say what it
      actually does that the previous version did not, and separate a shipped feature
      from an announced one.
    acceptance_criteria:
    - At least two named vendors or products, with what each one shipped or announced.
    - Shipped, in pilot, and announced are distinguished explicitly for every item.
    - Pricing and availability where stated; where not stated, a gap rather than a guess.
    - Every claim traceable to a source that was actually read.
    - >-
        Each organization is its own entry under a plain name (upGrad, not
        "upGrad / Unacademy (acquisition closed)"), and every theme names only
        organizations spelled exactly as they appear in that list.
    - >-
        Recommendations are for someone deciding what to do about ed-tech this
        week - what to watch, what to act on now, what to discount - and not
        campaign or messaging ideas.
    queries:
    - AI tutoring product launch education
    - AI grading assessment tool schools 2026
    - generative AI curriculum platform release
