apiVersion: agent-platform/v1
kind: Trigger
metadata:
  name: edtech-policy-and-regulation
spec:
  actor: research
  catchup: skip
  cron: 0 14 * * *
  timezone: Asia/Kolkata
  mode: work
  input:
    subject: education technology policy, regulation and student data rules
    title: 'Afternoon brief: policy and regulation'
    objective: >-
      Report movement in the rules that ed-tech has to live inside: AI-in-schools
      guidance, student data and privacy enforcement, procurement and accreditation
      changes, and national or state programmes with money attached. Name the ministry,
      agency, district or regulator and the instrument, and say who has to do something
      differently as a result.
    acceptance_criteria:
    - At least two named bodies, agencies, districts or vendors, each with the specific
      rule, ruling or programme that put it in this brief.
    - The jurisdiction and the date in force or proposed for each item.
    - Draft, in consultation, and in force are distinguished; a proposal is never
      reported as a rule.
    - Every claim traceable to a source that was actually read.
    - >-
        Each organization is its own entry under a plain name (upGrad, not
        "upGrad / Unacademy (acquisition closed)"), and every theme names only
        organizations spelled exactly as they appear in that list.
    - >-
        Recommendations are for someone deciding what to do about ed-tech this
        week - what to watch, what to act on now, what to discount - and not
        campaign or messaging ideas.
    queries:
    - AI in schools policy guidance government
    - student data privacy enforcement edtech
    - education technology procurement regulation 2026
