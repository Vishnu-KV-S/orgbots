      adoption, renewals and churn, pricing changes, partnership and distribution deals,
      earnings and usage data. Name the buyers as well as the sellers, and prefer a
      disclosed figure to an analyst's projection - say which one you are quoting.
    acceptance_criteria:
    - At least two named companies, each with the adoption number, deal or pricing change
      that put it in this brief.
    - Every figure attributed to whoever published it, with disclosed figures separated
      from projections and estimates.
    - Named buyers or institutions wherever a deal has them.
    - Every claim traceable to a source that was actually read.
