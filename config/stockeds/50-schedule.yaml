# Five briefs a day, in Asia/Kolkata, on five different beats.
#
# Five triggers rather than one firing five times, because a single brief run five
# times returns the same report five times: the model has no memory of 09:00 at 14:00
# (M3 is off), so only the brief can make the slots differ. Each trigger carries its
# own `subject`, `objective` and `acceptance_criteria`; `research@1`'s `load` node
# turns that payload into the brief the WORK call is written against.
#
# `catchup: skip` throughout: a runtime that was down since yesterday files one report
# when it comes back, not eleven. The fire key is `(trigger, occurrence)` and doubles
# as the run's idempotency key, so two schedulers or a restart mid-minute still produce
# one run per slot.
#
# **`CompetitorReport@1` requires at least two named organizations** (`competitors`,
# `min_length=2`) and at least three sources, and every theme may only name an
# organization the report already covers. That is why each objective below asks for
# named companies, products or institutions by name rather than for "trends": a brief
# that invites an abstract answer fails the schema, and a schema failure on the second
# attempt fails the run and costs WORK-class money for nothing.
#
# Two criteria repeat verbatim in all five briefs, and both are here because a real
# run failed on them rather than because they read well:
#
#   - **The naming rule.** On the first funding brief the model wrote a deal as one
#     competitor — `upGrad / Unacademy (acquisition closed)` — and then named `upGrad`
#     and `Unacademy` separately in its themes. `CompetitorReport`'s `_citations_resolve`
#     rejects a theme naming an organization the report does not cover, so the report
#     failed validation on its own two spellings of the same fact. A deal beat invites
#     compound names constantly; saying "one organization, one entry, spelled once"
#     costs a line and buys the retry back.
#
#   - **What a recommendation is for.** `research@1`'s system prompt is the M1
#     marketing department's — it tells the model recommendations are "for a marketing
#     team deciding what to say next week", and the first good report duly suggested
#     building a social-proof asset. That prompt is shared with every company on this
#     runtime and is not stockeds' to edit, so the brief redirects the field instead:
#     the objective is the one part of the context this file controls.

apiVersion: agent-platform/v1
kind: Trigger
metadata:
  name: edtech-funding-and-deals
spec:
  actor: research
  catchup: skip
  cron: 0 7 * * *
  timezone: Asia/Kolkata
  mode: work
  input:
    subject: ed-tech funding, acquisitions and shutdowns
    title: 'Morning brief: ed-tech money'
    objective: >-
      Report the funding rounds, acquisitions, wind-downs and public-market moves in
      education technology from the last 24-48 hours. Name the companies, the amounts
      and the investors or acquirers. Say what each deal implies about where the
      sector's money is going, and flag anything that contradicts last week.
    acceptance_criteria:
    - At least two named companies, each with the round or deal that put it in this brief.
    - Amounts, stages and named investors or acquirers wherever they were disclosed; an
      undisclosed amount is said to be undisclosed, never estimated.
    - Every claim traceable to a source that was actually read.
    - What could not be established goes in gaps rather than being smoothed over.
    - >-
        Each organization is its own entry under a plain name (upGrad, not
        "upGrad / Unacademy (acquisition closed)"), and every theme names only
        organizations spelled exactly as they appear in that list.
    - >-
        Recommendations are for someone deciding what to do about ed-tech this
        week - what to watch, what to act on now, what to discount - and not
        campaign or messaging ideas.
    queries:
    - ed-tech funding round announced this week
    - education technology acquisition 2026
    - edtech startup shutdown OR layoffs 2026
---
