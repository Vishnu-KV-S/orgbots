# Four ranks, of which two are filled. `operator` and `director` are here because
# an AuthorityPolicy names an approver by role and a role with no parent is where
# the resolver stops; leaving them out would make any future escalation unresolvable.
apiVersion: agent-platform/v1
kind: Role
metadata:
  name: operator
spec:
  approver: operator
  approverDailyBudget: 10
  baseAuthority: {}
  department: null
  parent: null
  rank: 0
---
apiVersion: agent-platform/v1
kind: Role
metadata:
  name: director
spec:
  approver: director
  approverDailyBudget: 4
  baseAuthority: {}
  department: edtech-research
  parent: operator
  rank: 5
---
apiVersion: agent-platform/v1
kind: Role
metadata:
  name: head
spec:
  approver: null
  approverDailyBudget: 10
  baseAuthority: {}
  department: edtech-research
  parent: director
  rank: 10
---
apiVersion: agent-platform/v1
kind: Role
metadata:
  name: ic
spec:
  approver: null
  approverDailyBudget: 10
  baseAuthority: {}
  department: edtech-research
  parent: head
  rank: 20
