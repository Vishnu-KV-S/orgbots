name: Docker image

# Builds the single-container image, boots it, and checks that the UI and the API
# answer through it. On main (and on version tags) it also publishes the image to
# ghcr.io, so `docker run ghcr.io/vishnu-kv-s/orgbots` works without a build.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yml
      - pyproject.toml
      - uv.lock
      - alembic.ini
      - config/**
      - src/**
      - ui/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: orgbots:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check it answers
        run: |
          docker run -d --name orgbots -p 3000:3000 orgbots:test
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/rt/v1/bots >/dev/null 2>&1; then
              echo "up after $((i * 2))s"
              break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          curl -fsS http://127.0.0.1:3000/rt/v1/bots
          echo
          # A clean stop: every process should exit within the timeout.
          docker stop --time 30 orgbots
          docker logs orgbots 2>&1 | tail -5

      - name: Logs
        if: failure()
        run: docker logs orgbots 2>&1 | tail -200

      - name: Image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
