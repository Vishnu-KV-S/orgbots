; The processes of the bots' computer. Each one's output goes to the container's log
; (`docker compose logs computer`); a process that exits is started again.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; The screen: an X server that is also a VNC server, reachable only from inside.
[program:display]
command=Xvnc %(ENV_DISPLAY)s -geometry %(ENV_COMPUTER_SCREEN)s -depth 24 -dpi 96
  -SecurityTypes None -localhost -rfbport 5901 -AlwaysShared -AcceptSetDesktopSize=0
  -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Every window maximised and undecorated (openbox.xml): a bot's window is the screen.
[program:windows]
command=sh -c 'while [ ! -S "/tmp/.X11-unix/X${DISPLAY#:}" ]; do sleep 0.1; done;
  exec openbox --config-file /etc/computer/openbox.xml'
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The whole desktop in a browser tab, for a person: noVNC over the VNC screen.
[program:desktop]
command=/opt/websockify/bin/websockify --web /opt/novnc 6080 localhost:5901
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The service the runtime drives the computer through. It starts Chrome.
[program:computer]
command=/usr/local/bin/start-computer
priority=40
autorestart=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
